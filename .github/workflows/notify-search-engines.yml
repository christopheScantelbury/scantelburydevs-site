name: Notify Search Engines

on:
  deployment_status:

jobs:
  notify:
    # Só dispara quando o Vercel reporta success no ambiente Production
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SITE_HOST: www.scantelburydevs.com.br
      INDEXNOW_KEY: e6f805a0dac67bc9dd774eabec01fdc6
      # URLs canônicas a notificar (espelham o sitemap.xml)
      URLS: |
        https://www.scantelburydevs.com.br/

    steps:
      - name: Aguardar propagação do CDN
        run: sleep 30

      - name: Verificar se o sitemap está acessível
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${SITE_HOST}/sitemap.xml")
          echo "GET /sitemap.xml → $status"
          test "$status" = "200"

      - name: Notificar IndexNow (Bing, Yandex, Naver, Seznam)
        run: |
          # Monta JSON com lista de URLs
          urlList=$(echo "$URLS" | grep -v '^$' | jq -R . | jq -s .)
          payload=$(jq -n \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://$SITE_HOST/$INDEXNOW_KEY.txt" \
            --argjson urlList "$urlList" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urlList}')

          echo "Payload:"
          echo "$payload"

          response=$(curl -sS -w "\nHTTP %{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            https://api.indexnow.org/IndexNow)

          echo "Resposta IndexNow:"
          echo "$response"

